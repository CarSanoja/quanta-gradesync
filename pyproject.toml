[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocurricula"
version = "0.1.0"
description = "AutoCurricula & GradeSync Engine: event-driven multimodal exam grading, curriculum auditing, and SIS sync on GCP"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "uvloop>=0.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-adk>=1.0",
    "google-genai>=1.0",
    "google-cloud-pubsub>=2.21",
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.17",
    "httpx>=0.27",
    "pillow>=10.3",
    "opentelemetry-sdk>=1.43",
    "opentelemetry-exporter-otlp-proto-http>=1.43",
    "opentelemetry-resourcedetector-gcp>=1.6.0a0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.5",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "benchmark: throughput/concurrency stress tests",
    "calibration: ground-truth prompt quality tests",
    "live: contract tests against real Gemini models (require ADC and a GCP project)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is `Depends(...)` in a default argument. B008
# exists for mutable defaults; this is the framework's documented idiom and
# rewriting it would make the routes worse.
"src/autocurricula/api/*.py" = ["B008"]
