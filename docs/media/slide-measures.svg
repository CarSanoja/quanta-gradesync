<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d93025"/></marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="100" y="74" font-size="24" font-weight="bold" letter-spacing="7" fill="#80868b">IT MEASURES ITSELF</text>
  <text x="100" y="132" font-size="52" font-weight="bold" fill="#202124">It compared itself to human graders &#8212; and refused its own upgrade.</text>
  <line x1="100" y1="158" x2="1820" y2="158" stroke="#e8eaed" stroke-width="2"/>

  <!-- five stops -->
  <rect x="100" y="210" width="312" height="175" rx="12" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"/>
  <circle cx="138" cy="252" r="21" fill="#8430ce"/>
  <text x="138" y="261" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="122" y="320" font-size="27" font-weight="bold" fill="#5b2c8d">Exams a human</text>
  <text x="122" y="354" font-size="27" font-weight="bold" fill="#5b2c8d">already graded</text>

  <rect x="452" y="210" width="312" height="175" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="490" cy="252" r="21" fill="#1a73e8"/>
  <text x="490" y="261" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="474" y="320" font-size="27" font-weight="bold" fill="#174ea6">Propose a new</text>
  <text x="474" y="354" font-size="27" font-weight="bold" fill="#174ea6">prompt</text>

  <rect x="804" y="210" width="312" height="175" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <circle cx="842" cy="252" r="21" fill="#1a73e8"/>
  <text x="842" y="261" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="826" y="320" font-size="27" font-weight="bold" fill="#174ea6">Re-score the</text>
  <text x="826" y="354" font-size="27" font-weight="bold" fill="#174ea6">same exams</text>

  <rect x="1156" y="210" width="312" height="175" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <circle cx="1194" cy="252" r="21" fill="#d93025"/>
  <text x="1194" y="261" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1178" y="320" font-size="27" font-weight="bold" fill="#a50e0e">Anti-gaming</text>
  <text x="1178" y="354" font-size="27" font-weight="bold" fill="#a50e0e">and a hard gate</text>

  <rect x="1508" y="210" width="312" height="175" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="3"/>
  <circle cx="1546" cy="252" r="21" fill="#d93025"/>
  <text x="1546" y="261" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1530" y="320" font-size="27" font-weight="bold" fill="#a50e0e">Promote</text>
  <text x="1530" y="354" font-size="27" font-weight="bold" fill="#a50e0e">or reject</text>

  <g stroke="#5f6368" stroke-width="3">
    <line x1="420" y1="298" x2="444" y2="298" marker-end="url(#g)"/>
    <line x1="772" y1="298" x2="796" y2="298" marker-end="url(#g)"/>
    <line x1="1124" y1="298" x2="1148" y2="298" marker-end="url(#g)"/>
    <line x1="1476" y1="298" x2="1500" y2="298" marker-end="url(#g)"/>
  </g>

  <path d="M1664 385 L1664 438 L608 438 L608 391" fill="none" stroke="#80868b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#g)"/>
  <text x="1136" y="418" font-size="24" font-style="italic" fill="#5f6368" text-anchor="middle">a winner would start the next cycle &#8212; none did</text>

  <!-- outcome, left: the bar -->
  <rect x="100" y="470" width="830" height="390" rx="14" fill="#ffffff" stroke="#1a73e8" stroke-width="3"/>
  <text x="140" y="524" font-size="26" font-weight="bold" letter-spacing="4" fill="#174ea6">THE BAR, MEASURED AGAINST HUMANS</text>
  <text x="310" y="690" font-size="118" font-weight="bold" fill="#202124" text-anchor="middle">0.845</text>
  <text x="310" y="740" font-size="28" fill="#3c4043" text-anchor="middle">QWK &#8212; agreement</text>
  <text x="310" y="776" font-size="24" fill="#80868b" text-anchor="middle">with human graders</text>
  <text x="720" y="690" font-size="118" font-weight="bold" fill="#202124" text-anchor="middle">0.208</text>
  <text x="720" y="740" font-size="28" fill="#3c4043" text-anchor="middle">MAE &#8212; average miss</text>
  <text x="720" y="776" font-size="24" fill="#80868b" text-anchor="middle">in mastery buckets</text>
  <text x="515" y="826" font-size="24" fill="#5f6368" text-anchor="middle">the active prompt, re-measured every cycle</text>

  <!-- outcome, right: the refusal -->
  <rect x="990" y="470" width="830" height="390" rx="14" fill="#ffffff" stroke="#d93025" stroke-width="3"/>
  <text x="1030" y="524" font-size="26" font-weight="bold" letter-spacing="4" fill="#a50e0e">WHAT IT DID WITH ITS OWN UPGRADES</text>
  <text x="1405" y="680" font-size="132" font-weight="bold" fill="#d93025" text-anchor="middle">3 of 3</text>
  <text x="1405" y="742" font-size="42" font-weight="bold" fill="#202124" text-anchor="middle">candidate prompts REJECTED</text>
  <text x="1405" y="790" font-size="28" fill="#3c4043" text-anchor="middle">None beat the baseline. A tie loses.</text>
  <text x="1405" y="834" font-size="26" font-weight="bold" fill="#a50e0e" text-anchor="middle">0 promoted &#8212; the prompt did not change.</text>

  <text x="100" y="928" font-size="28" fill="#3c4043">The honest limit &#8212; 4 human-graded students, 12 criterion pairs.</text>
  <text x="100" y="970" font-size="26" font-style="italic" fill="#80868b">A starting point, not a benchmark.</text>
  <text x="1820" y="970" font-size="24" font-style="italic" fill="#80868b" text-anchor="end">calibration-2026-08-20.md</text>
</svg>
