<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d93025"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8430ce"/></marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="100" y="74" font-size="24" font-weight="bold" letter-spacing="7" fill="#80868b">DEFENCE IN DEPTH</text>
  <text x="100" y="132" font-size="52" font-weight="bold" fill="#202124">Ten gates stand between a grade and a student record.</text>
  <line x1="100" y1="158" x2="1820" y2="158" stroke="#e8eaed" stroke-width="2"/>

  <!-- ===== left: the ordered ten ===== -->
  <text x="100" y="206" font-size="26" font-weight="bold" letter-spacing="4" fill="#80868b">IN THE ORDER THEY APPLY</text>

  <g font-size="27" fill="#202124">
    <rect x="100" y="234" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="263" r="19" fill="#d93025"/><text x="136" y="272" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="172" y="272">Filename and metadata screen</text>

    <rect x="100" y="298" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="327" r="19" fill="#d93025"/><text x="136" y="336" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="172" y="336">Per-exam model call budget</text>

    <rect x="100" y="362" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="391" r="19" fill="#d93025"/><text x="136" y="400" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="172" y="400">Encoded-payload prescreen</text>

    <rect x="100" y="426" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="455" r="19" fill="#d93025"/><text x="136" y="464" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="172" y="464">Model Armor injection screen</text>

    <rect x="100" y="490" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="519" r="19" fill="#d93025"/><text x="136" y="528" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="172" y="528">Evidence faithfulness check</text>

    <rect x="100" y="554" width="700" height="58" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="3"/>
    <circle cx="136" cy="583" r="19" fill="#d93025"/><text x="136" y="592" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="172" y="592" font-weight="bold" fill="#a50e0e">Legibility discount</text>

    <rect x="100" y="618" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="647" r="19" fill="#d93025"/><text x="136" y="656" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <text x="172" y="656">Confidence gate &#8805; 0.85</text>

    <rect x="100" y="682" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="711" r="19" fill="#d93025"/><text x="136" y="720" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
    <text x="172" y="720">Write-permission gate</text>

    <rect x="100" y="746" width="700" height="58" rx="8" fill="#ffffff" stroke="#f6c6c2" stroke-width="2"/>
    <circle cx="136" cy="775" r="19" fill="#d93025"/><text x="136" y="784" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
    <text x="172" y="784">Batch anomaly breaker</text>

    <rect x="100" y="810" width="700" height="58" rx="8" fill="#ffffff" stroke="#aecbfa" stroke-width="2"/>
    <circle cx="136" cy="839" r="19" fill="#1a73e8"/><text x="136" y="848" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <text x="172" y="848">Provenance receipt</text>
  </g>

  <!-- ===== right: one gate, enlarged ===== -->
  <line x1="812" y1="583" x2="888" y2="583" stroke="#d93025" stroke-width="4" marker-end="url(#r)"/>

  <rect x="900" y="234" width="920" height="400" rx="14" fill="#ffffff" stroke="#d93025" stroke-width="4"/>
  <text x="1360" y="292" font-size="26" font-weight="bold" letter-spacing="4" fill="#a50e0e" text-anchor="middle">GATE 6 &#183; ONE OF THE TEN</text>
  <text x="1360" y="418" font-size="118" font-weight="bold" text-anchor="middle"><tspan fill="#5f6368">0.98</tspan><tspan fill="#80868b"> &#8594; </tspan><tspan fill="#d93025">0.49</tspan></text>
  <text x="1360" y="478" font-size="28" fill="#202124" text-anchor="middle">The model said it was 0.98 confident.</text>
  <text x="1360" y="520" font-size="28" fill="#202124" text-anchor="middle">A blur measurement cut that to 0.49.</text>
  <text x="1360" y="574" font-size="34" font-weight="bold" fill="#a50e0e" text-anchor="middle">The gate is 0.85. It stopped.</text>
  <text x="1360" y="616" font-size="24" font-style="italic" fill="#80868b" text-anchor="middle">resilience-2026-08-20.md &#183; camila-rios</text>

  <line x1="1360" y1="642" x2="1360" y2="700" stroke="#8430ce" stroke-width="4" marker-end="url(#p)"/>

  <rect x="900" y="706" width="920" height="162" rx="14" fill="#f3e8fd" stroke="#8430ce" stroke-width="4"/>
  <text x="1360" y="778" font-size="46" font-weight="bold" fill="#5b2c8d" text-anchor="middle">A human decides. Never a guess.</text>
  <text x="1360" y="826" font-size="28" fill="#5b2c8d" text-anchor="middle">The grade waits in a queue. Nothing is written.</text>

  <!-- ===== footer ===== -->
  <line x1="100" y1="920" x2="1820" y2="920" stroke="#e8eaed" stroke-width="2"/>
  <text x="960" y="978" font-size="32" font-weight="bold" fill="#3c4043" text-anchor="middle">Every gate is deterministic code &#8212; not advice to the model.</text>
  <text x="960" y="1020" font-size="26" fill="#5f6368" text-anchor="middle">The first refusal wins, and the grade is held with the page and the quote attached.</text>
</svg>
