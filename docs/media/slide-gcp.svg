<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="100" y="74" font-size="24" font-weight="bold" letter-spacing="7" fill="#80868b">THE GOOGLE CLOUD FOOTPRINT</text>
  <text x="100" y="132" font-size="52" font-weight="bold" fill="#202124">Eleven Google Cloud services, all of them in use.</text>
  <line x1="100" y1="158" x2="1820" y2="158" stroke="#e8eaed" stroke-width="2"/>
  <rect x="100" y="180" width="1720" height="88" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
  <text x="960" y="219" font-size="34" font-weight="bold" fill="#174ea6" text-anchor="middle">Google ADK agents. Every model call is Gemini 3.5 on Vertex AI.</text>
  <text x="960" y="253" font-size="26" fill="#174ea6" text-anchor="middle">Flash grades &#183; Flash-Lite audits and screens &#183; text-embedding-005 retrieves</text>
  <rect x="100" y="300" width="412" height="710" rx="14" fill="#f8f9fa"/>
  <text x="120" y="346" font-size="26" font-weight="bold" letter-spacing="3" fill="#3c4043">RUN &#183; INGEST</text>
  <rect x="118" y="372" width="376" height="200" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="138" y="430" font-size="28" font-weight="bold" fill="#174ea6">Cloud Run</text>
  <text x="138" y="470" font-size="24" fill="#174ea6">one FastAPI service</text>
  <text x="138" y="502" font-size="24" fill="#174ea6">scales 0 to 2 instances</text>
  <text x="138" y="534" font-size="24" fill="#174ea6">CPU always allocated</text>
  <rect x="118" y="591" width="376" height="200" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="138" y="665" font-size="28" font-weight="bold" fill="#7f5c00">Cloud Storage</text>
  <text x="138" y="705" font-size="24" fill="#7f5c00">versioned exam bucket &#8212;</text>
  <text x="138" y="737" font-size="24" fill="#7f5c00">a scan is never lost</text>
  <rect x="118" y="810" width="376" height="200" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="138" y="884" font-size="28" font-weight="bold" fill="#7f5c00">Pub/Sub</text>
  <text x="138" y="924" font-size="24" fill="#7f5c00">push subscription, OIDC,</text>
  <text x="138" y="956" font-size="24" fill="#7f5c00">audience pinned</text>
  <rect x="536" y="300" width="412" height="710" rx="14" fill="#f8f9fa"/>
  <text x="556" y="346" font-size="26" font-weight="bold" letter-spacing="3" fill="#3c4043">DATA &#183; MODELS</text>
  <rect x="554" y="372" width="376" height="309" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="574" y="468" font-size="28" font-weight="bold" fill="#0d652d">Firestore</text>
  <text x="574" y="508" font-size="24" fill="#0d652d">checkpoints + session state</text>
  <text x="574" y="540" font-size="24" fill="#0d652d">student profiles, prompts,</text>
  <text x="574" y="572" font-size="24" fill="#0d652d">review queue, SIS ledger</text>
  <text x="574" y="604" font-size="24" fill="#0d652d">vector search at 768 d</text>
  <rect x="554" y="700" width="376" height="309" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="574" y="796" font-size="28" font-weight="bold" fill="#0d652d">Vertex AI</text>
  <text x="574" y="836" font-size="24" fill="#0d652d">Gemini 3.5 Flash grades</text>
  <text x="574" y="868" font-size="24" fill="#0d652d">Flash-Lite audits + screens</text>
  <text x="574" y="900" font-size="24" fill="#0d652d">text-embedding-005 embeds</text>
  <text x="574" y="932" font-size="24" fill="#0d652d">location: global</text>
  <rect x="972" y="300" width="412" height="710" rx="14" fill="#f8f9fa"/>
  <text x="992" y="346" font-size="26" font-weight="bold" letter-spacing="3" fill="#3c4043">BUILD &#183; OBSERVE</text>
  <rect x="990" y="372" width="376" height="200" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="1010" y="430" font-size="28" font-weight="bold" fill="#0d652d">Cloud Build</text>
  <text x="1010" y="470" font-size="24" fill="#0d652d">builds and deploys from</text>
  <text x="1010" y="502" font-size="24" fill="#0d652d">source on its own</text>
  <text x="1010" y="534" font-size="24" fill="#0d652d">least-privilege account</text>
  <rect x="990" y="591" width="376" height="200" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="1010" y="665" font-size="28" font-weight="bold" fill="#0d652d">Artifact Registry</text>
  <text x="1010" y="705" font-size="24" fill="#0d652d">every container image,</text>
  <text x="1010" y="737" font-size="24" fill="#0d652d">tagged by commit SHA</text>
  <rect x="990" y="810" width="376" height="200" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="1010" y="884" font-size="28" font-weight="bold" fill="#0d652d">Cloud Logging</text>
  <text x="1010" y="924" font-size="24" fill="#0d652d">build and request logs</text>
  <text x="1010" y="956" font-size="24" fill="#0d652d">in one place</text>
  <rect x="1408" y="300" width="412" height="710" rx="14" fill="#f8f9fa"/>
  <text x="1428" y="346" font-size="26" font-weight="bold" letter-spacing="3" fill="#3c4043">GUARD</text>
  <rect x="1426" y="372" width="376" height="200" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="1446" y="446" font-size="28" font-weight="bold" fill="#a50e0e">Secret Manager</text>
  <text x="1446" y="486" font-size="24" fill="#a50e0e">the push token, mounted</text>
  <text x="1446" y="518" font-size="24" fill="#a50e0e">at deploy &#8212; never in git</text>
  <rect x="1426" y="591" width="376" height="200" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="1446" y="665" font-size="28" font-weight="bold" fill="#a50e0e">IAM service accounts</text>
  <text x="1446" y="705" font-size="24" fill="#a50e0e">runner, builder and SIS</text>
  <text x="1446" y="737" font-size="24" fill="#a50e0e">writer, kept separate</text>
  <rect x="1426" y="810" width="376" height="200" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="1446" y="884" font-size="28" font-weight="bold" fill="#a50e0e">Billing budget</text>
  <text x="1446" y="924" font-size="24" fill="#a50e0e">$200 cap, alerts at</text>
  <text x="1446" y="956" font-size="24" fill="#a50e0e">25 / 50 / 75 / 100%</text>
</svg>
