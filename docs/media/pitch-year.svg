    <rect x="1252" y="786" width="108" height="108" rx="10"/>
    <rect x="1378" y="786" width="108" height="108" rx="10"/>
    <rect x="1504" y="786" width="108" height="108" rx="10"/>
  </g>

  <line x1="330" y1="975" x2="1590" y2="975" stroke="#dadce0" stroke-width="2"/>
  <text x="960" y="1030" font-size="32" fill="#3c4043" text-anchor="middle">A full working month of her year, eight hours a day, spent marking by hand.</text>
