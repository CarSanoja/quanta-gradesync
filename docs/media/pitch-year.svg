    <rect x="1504" y="282" width="108" height="108" rx="10"/>
    <rect x="1000" y="408" width="108" height="108" rx="10"/>
    <rect x="1126" y="408" width="108" height="108" rx="10"/>
    <rect x="1252" y="408" width="108" height="108" rx="10"/>
    <rect x="1378" y="408" width="108" height="108" rx="10"/>
    <rect x="1504" y="408" width="108" height="108" rx="10"/>
    <rect x="1000" y="534" width="108" height="108" rx="10"/>
    <rect x="1126" y="534" width="108" height="108" rx="10"/>
    <rect x="1252" y="534" width="108" height="108" rx="10"/>
    <rect x="1378" y="534" width="108" height="108" rx="10"/>
    <rect x="1504" y="534" width="108" height="108" rx="10"/>
    <rect x="1000" y="660" width="108" height="108" rx="10"/>
    <rect x="1126" y="660" width="108" height="108" rx="10"/>
    <rect x="1252" y="660" width="108" height="108" rx="10"/>
    <rect x="1378" y="660" width="108" height="108" rx="10"/>
    <rect x="1504" y="660" width="108" height="108" rx="10"/>
