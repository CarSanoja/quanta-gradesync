<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="960" y="112" font-size="24" font-weight="bold" letter-spacing="6" fill="#80868b" text-anchor="middle">WHAT THAT IS IN A YEAR</text>
  <text x="960" y="186" font-size="54" font-weight="bold" fill="#202124" text-anchor="middle">Ten school months of the same.</text>

  <!-- LEFT: the focal number -->
  <text x="520" y="645" font-size="252" font-weight="bold" fill="#8430ce" text-anchor="middle">180</text>
  <text x="520" y="717" font-size="46" font-weight="bold" letter-spacing="5" fill="#3c4043" text-anchor="middle">HOURS A YEAR</text>

  <text x="860" y="614" font-size="72" font-weight="bold" fill="#9aa0a6" text-anchor="middle">=</text>

  <!-- RIGHT: a working month, filled in -->
  <text x="1306" y="252" font-size="26" font-weight="bold" letter-spacing="4" fill="#5f6368" text-anchor="middle">MORE THAN 22 WORKING DAYS</text>

  <g fill="#8430ce">
