<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="100" y="86" font-size="24" font-weight="bold" letter-spacing="7" fill="#80868b">BEYOND THE PRODUCT</text>
  <text x="100" y="150" font-size="52" font-weight="bold" fill="#202124">Building this produced more than the product.</text>
  <text x="100" y="192" font-size="26" fill="#5f6368">two upstream bugs, a published benchmark, an audit of our own limits</text>
  <line x1="100" y1="222" x2="1820" y2="222" stroke="#e8eaed" stroke-width="2"/>

  <!-- panel A: filed upstream -->
  <g>
    <rect x="100" y="262" width="760" height="660" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
    <rect x="100" y="262" width="760" height="78" rx="14" fill="#188038"/>
    <rect x="100" y="326" width="760" height="14" fill="#188038"/>
    <text x="144" y="314" font-size="30" font-weight="bold" fill="#ffffff">Two bugs in Google&#8217;s agent stack</text>

    <text x="144" y="404" font-size="30" font-weight="bold" fill="#202124">ADK rejects the most common parameter</text>
    <text x="144" y="444" font-size="26" fill="#5f6368">confirmed by a maintainer; a fix PR is open</text>
    <text x="144" y="480" font-size="26" fill="#5f6368">we verified it against four edge cases</text>
    <rect x="144" y="500" width="596" height="52" rx="8" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="172" y="535" font-size="26" font-weight="bold" fill="#202124">github.com/google/adk-python/issues/6836</text>

    <line x1="144" y1="590" x2="816" y2="590" stroke="#e8eaed" stroke-width="2"/>

    <text x="144" y="646" font-size="30" font-weight="bold" fill="#202124">Vertex silently empties dict fields</text>
    <text x="144" y="686" font-size="26" fill="#5f6368">acknowledged; a maintainer filed an internal bug</text>
    <text x="144" y="722" font-size="26" fill="#5f6368">we contributed the workaround we ship</text>
    <rect x="144" y="742" width="664" height="52" rx="8" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="172" y="777" font-size="26" font-weight="bold" fill="#202124">github.com/googleapis/python-genai/issues/2889</text>

    <text x="144" y="878" font-size="24" font-style="italic" fill="#80868b">docs/upstream/ &#8212; both filed from this build</text>
  </g>

  <!-- panel B: published in the repo -->
  <g>
    <rect x="900" y="262" width="440" height="660" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
    <rect x="900" y="262" width="440" height="78" rx="14" fill="#d93025"/>
    <rect x="900" y="326" width="440" height="14" fill="#d93025"/>
    <text x="936" y="314" font-size="30" font-weight="bold" fill="#ffffff">Published in the repo</text>

    <text x="936" y="448" font-size="72" font-weight="bold" fill="#d93025">13</text>
    <text x="936" y="490" font-size="26" fill="#3c4043">injection classes, mapped</text>

    <text x="936" y="598" font-size="72" font-weight="bold" fill="#d93025">3</text>
    <text x="936" y="640" font-size="26" fill="#3c4043">benchmark tiers, specified</text>

    <text x="936" y="748" font-size="72" font-weight="bold" fill="#d93025">38</text>
    <text x="936" y="790" font-size="26" fill="#3c4043">findings on our own limits</text>

    <text x="936" y="878" font-size="24" font-style="italic" fill="#80868b">gradesync-bench &#183; limits review</text>
  </g>

  <!-- panel C: written for other builders -->
  <g>
    <rect x="1380" y="262" width="440" height="660" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
    <rect x="1380" y="262" width="440" height="78" rx="14" fill="#8430ce"/>
    <rect x="1380" y="326" width="440" height="14" fill="#8430ce"/>
    <text x="1416" y="314" font-size="30" font-weight="bold" fill="#ffffff">For other builders</text>

    <text x="1416" y="448" font-size="72" font-weight="bold" fill="#8430ce">5</text>
    <text x="1416" y="490" font-size="26" fill="#3c4043">engineering findings</text>
    <text x="1416" y="526" font-size="26" fill="#3c4043">published with the numbers</text>

    <line x1="1416" y1="590" x2="1784" y2="590" stroke="#e8eaed" stroke-width="2"/>

    <circle cx="1422" cy="648" r="5" fill="#8430ce"/>
    <text x="1444" y="657" font-size="26" fill="#3c4043">confidence is not a signal</text>
    <circle cx="1422" cy="704" r="5" fill="#8430ce"/>
    <text x="1444" y="713" font-size="26" fill="#3c4043">a silent SDK failure mode</text>
    <circle cx="1422" cy="760" r="5" fill="#8430ce"/>
    <text x="1444" y="769" font-size="26" fill="#3c4043">a CPU stall that ate retries</text>

    <text x="1416" y="878" font-size="24" font-style="italic" fill="#80868b">docs/submission/devpost.md</text>
  </g>
</svg>
