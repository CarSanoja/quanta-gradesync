<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="100" y="74" font-size="24" font-weight="bold" letter-spacing="7" fill="#80868b">THE AGENT FLEET</text>
  <text x="100" y="132" font-size="52" font-weight="bold" fill="#202124">A fleet with a shape, not a pile of prompts.</text>
  <text x="1820" y="132" font-size="26" fill="#5f6368" text-anchor="end">twelve components</text>
  <line x1="100" y1="158" x2="1820" y2="158" stroke="#e8eaed" stroke-width="2"/>

  <!-- ============ HOT PATH ============ -->
  <rect x="100" y="200" width="532" height="650" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
  <text x="130" y="254" font-size="30" font-weight="bold" letter-spacing="3" fill="#174ea6">HOT PATH</text>
  <text x="130" y="294" font-size="24" fill="#174ea6">every exam, one push request</text>

  <rect x="118" y="320" width="496" height="96" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="144" y="360" font-size="28" font-weight="bold" fill="#174ea6">Grading agent</text>
  <text x="144" y="396" font-size="24" fill="#0d652d">Gemini 3.5 Flash</text>

  <rect x="118" y="424" width="496" height="96" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="144" y="464" font-size="28" font-weight="bold" fill="#174ea6">Curriculum auditor</text>
  <text x="144" y="500" font-size="24" fill="#0d652d">Gemini 3.5 Flash-Lite</text>

  <rect x="118" y="528" width="496" height="96" rx="10" fill="#ffffff" stroke="#d93025" stroke-width="2"/>
  <text x="144" y="568" font-size="28" font-weight="bold" fill="#a50e0e">Armor screener</text>
  <text x="144" y="604" font-size="24" fill="#0d652d">Gemini 3.5 Flash-Lite</text>

  <rect x="118" y="632" width="496" height="96" rx="10" fill="#ffffff" stroke="#80868b" stroke-width="2"/>
  <text x="144" y="672" font-size="28" font-weight="bold" fill="#3c4043">Risk detector</text>
  <text x="144" y="708" font-size="24" fill="#5f6368">deterministic code</text>

  
  <rect x="118" y="736" width="496" height="96" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="144" y="776" font-size="28" font-weight="bold" fill="#174ea6">Evidence transcriber</text>
  <text x="144" y="812" font-size="24" fill="#0d652d">Gemini 3.5 Flash-Lite</text>

<!-- ============ RECOVERY ============ -->
  <rect x="694" y="200" width="532" height="650" rx="14" fill="#f8f9fa" stroke="#80868b" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="724" y="254" font-size="30" font-weight="bold" letter-spacing="3" fill="#3c4043">RECOVERY</text>
  <text x="724" y="294" font-size="24" fill="#3c4043">only when something breaks</text>

  <rect x="712" y="320" width="496" height="151" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="738" y="386" font-size="28" font-weight="bold" fill="#174ea6">Second-opinion evaluator</text>
  <text x="738" y="424" font-size="24" fill="#0d652d">Gemini 3.5 Flash-Lite</text>

  <rect x="712" y="485" width="496" height="151" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="738" y="551" font-size="28" font-weight="bold" fill="#174ea6">Fallback evaluator</text>
  <text x="738" y="589" font-size="24" fill="#0d652d">Gemini 3.5 Flash-Lite</text>

  <rect x="712" y="650" width="496" height="151" rx="10" fill="#ffffff" stroke="#80868b" stroke-width="2"/>
  <text x="738" y="716" font-size="28" font-weight="bold" fill="#3c4043">Schema repair</text>
  <text x="738" y="754" font-size="24" fill="#5f6368">deterministic code</text>

  <!-- ============ COLD LOOP ============ -->
  <rect x="1288" y="200" width="532" height="650" rx="14" fill="#f8f9fa" stroke="#5f6368" stroke-width="3"/>
  <text x="1318" y="254" font-size="30" font-weight="bold" letter-spacing="3" fill="#3c4043">COLD LOOP</text>
  <text x="1318" y="294" font-size="24" fill="#3c4043">self-improvement, off the clock</text>

  <rect x="1306" y="320" width="496" height="151" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="1332" y="386" font-size="28" font-weight="bold" fill="#174ea6">Prompt proposer</text>
  <text x="1332" y="424" font-size="24" fill="#0d652d">Gemini 3.5 Flash-Lite</text>

  <rect x="1306" y="485" width="496" height="151" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="1332" y="551" font-size="28" font-weight="bold" fill="#174ea6">Calibration evaluator</text>
  <text x="1332" y="589" font-size="24" fill="#0d652d">Gemini 3.5 Flash</text>

  <rect x="1306" y="650" width="496" height="151" rx="10" fill="#ffffff" stroke="#80868b" stroke-width="2"/>
  <text x="1332" y="716" font-size="28" font-weight="bold" fill="#3c4043">Meta-optimizer &#215; 2</text>
  <text x="1332" y="754" font-size="24" fill="#5f6368">grading and audit &#183; deterministic code</text>

  <!-- ============ FOOTER ============ -->
  <rect x="100" y="890" width="1720" height="110" rx="12" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  <text x="960" y="938" font-size="30" font-weight="bold" fill="#202124" text-anchor="middle">Eight model-backed. Four deterministic. Derived live from the running configuration.</text>
  <text x="960" y="978" font-size="24" font-style="italic" fill="#5f6368" text-anchor="middle">GET /fleet/registry &#8212; the list cannot drift from the code</text>
</svg>
