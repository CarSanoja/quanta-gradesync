<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="0" y="575" width="1920" height="330" fill="#f4ecfb"/>

  <text x="960" y="112" font-size="24" font-weight="bold" letter-spacing="6" fill="#80868b" text-anchor="middle">THE ARITHMETIC NOBODY DOES</text>
  <text x="960" y="186" font-size="54" font-weight="bold" fill="#202124" text-anchor="middle">One teacher. One month of marking.</text>

  <!-- INPUT CARDS -->
  <g>
    <rect x="270" y="250" width="400" height="228" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
    <text x="470" y="372" font-size="104" font-weight="bold" fill="#202124" text-anchor="middle">100</text>
    <text x="470" y="418" font-size="28" fill="#3c4043" text-anchor="middle">students</text>
    <text x="470" y="452" font-size="21" fill="#80868b" text-anchor="middle">across her class groups</text>
  </g>
  <text x="715" y="382" font-size="52" font-weight="bold" fill="#9aa0a6" text-anchor="middle">×</text>
  <g>
    <rect x="760" y="250" width="400" height="228" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
    <text x="960" y="372" font-size="104" font-weight="bold" fill="#202124" text-anchor="middle">200</text>
    <text x="960" y="418" font-size="28" fill="#3c4043" text-anchor="middle">exams a month</text>
    <text x="960" y="452" font-size="21" fill="#80868b" text-anchor="middle">2 per student, with make-ups</text>
  </g>
  <text x="1205" y="382" font-size="52" font-weight="bold" fill="#9aa0a6" text-anchor="middle">×</text>
  <g>
    <rect x="1250" y="250" width="400" height="228" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
    <text x="1450" y="372" font-size="104" font-weight="bold" fill="#202124" text-anchor="middle">5</text>
    <text x="1450" y="418" font-size="28" fill="#3c4043" text-anchor="middle">minutes each</text>
    <text x="1450" y="452" font-size="21" fill="#80868b" text-anchor="middle">handwritten, against a rubric</text>
  </g>

  <text x="960" y="534" font-size="56" font-weight="bold" fill="#9aa0a6" text-anchor="middle">=</text>

  <!-- FOCAL -->
  <text x="960" y="790" text-anchor="middle">
    <tspan font-size="58" fill="#5f6368">about</tspan><tspan font-size="240" font-weight="bold" fill="#8430ce" dx="26">18</tspan><tspan font-size="84" font-weight="bold" fill="#202124" dx="52">hours</tspan>
  </text>
  <text x="960" y="862" font-size="44" font-weight="bold" letter-spacing="5" fill="#3c4043" text-anchor="middle">A MONTH, MARKING BY HAND</text>

  <line x1="330" y1="952" x2="1590" y2="952" stroke="#dadce0" stroke-width="2"/>
  <text x="960" y="1004" font-size="28" fill="#5f6368" text-anchor="middle">Not a claim — arithmetic. The OECD measures it separately: TALIS 2024 puts marking at 4.6 h a week. The same 18 hours.</text>
</svg>
