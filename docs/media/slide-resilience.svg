<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="100" y="86" font-size="24" font-weight="bold" letter-spacing="7" fill="#80868b">IT SURVIVES FAILURE</text>
  <text x="100" y="150" font-size="52" font-weight="bold" fill="#202124">We executed these four failures. All four recovered.</text>
  <text x="100" y="192" font-size="26" fill="#5f6368">resilience-2026-08-20.md &#8212; executed, deployed service and live GCP mode</text>
  <line x1="100" y1="222" x2="1820" y2="222" stroke="#e8eaed" stroke-width="2"/>

  <!-- tile 1 -->
  <g>
    <rect x="100" y="256" width="830" height="350" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
    <rect x="100" y="256" width="830" height="78" rx="14" fill="#d93025"/>
    <rect x="100" y="320" width="830" height="14" fill="#d93025"/>
    <text x="144" y="308" font-size="32" font-weight="bold" fill="#ffffff">Duplicate delivery</text>
    <rect x="112" y="368" width="7" height="188" rx="3.5" fill="#1a73e8"/>
    <text x="144" y="396" font-size="30" fill="#202124">Answered &#8220;duplicate&#8221; before any work begins</text>
    <text x="144" y="504" font-size="92" font-weight="bold" fill="#1a73e8">0</text>
    <text x="144" y="556" font-size="26" fill="#5f6368">new writes across two live deliveries</text>
  </g>

  <!-- tile 2 -->
  <g>
    <rect x="990" y="256" width="830" height="350" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
    <rect x="990" y="256" width="830" height="78" rx="14" fill="#d93025"/>
    <rect x="990" y="320" width="830" height="14" fill="#d93025"/>
    <text x="1034" y="308" font-size="32" font-weight="bold" fill="#ffffff">Instance killed mid-batch</text>
    <rect x="1002" y="368" width="7" height="188" rx="3.5" fill="#1a73e8"/>
    <text x="1034" y="396" font-size="30" fill="#202124">Redelivered &#8212; resumes from its checkpoint</text>
    <text x="1034" y="504" font-size="92" font-weight="bold" fill="#1a73e8">1.7 s</text>
    <text x="1034" y="556" font-size="26" fill="#5f6368">a job stuck for a day, finished</text>
  </g>

  <!-- tile 3 -->
  <g>
    <rect x="100" y="656" width="830" height="350" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
    <rect x="100" y="656" width="830" height="78" rx="14" fill="#d93025"/>
    <rect x="100" y="720" width="830" height="14" fill="#d93025"/>
    <text x="144" y="708" font-size="32" font-weight="bold" fill="#ffffff">The school system unreachable</text>
    <rect x="112" y="768" width="7" height="188" rx="3.5" fill="#1a73e8"/>
    <text x="144" y="796" font-size="30" fill="#202124">Records parked in a dead-letter queue</text>
    <text x="144" y="904" font-size="92" font-weight="bold" fill="#1a73e8">2 of 6</text>
    <text x="144" y="956" font-size="26" fill="#5f6368">records re-sent &#8212; only the orphans</text>
  </g>

  <!-- tile 4 -->
  <g>
    <rect x="990" y="656" width="830" height="350" rx="14" fill="#ffffff" stroke="#dadce0" stroke-width="2"/>
    <rect x="990" y="656" width="830" height="78" rx="14" fill="#d93025"/>
    <rect x="990" y="720" width="830" height="14" fill="#d93025"/>
    <text x="1034" y="708" font-size="32" font-weight="bold" fill="#ffffff">One exam crashes</text>
    <rect x="1002" y="768" width="7" height="188" rx="3.5" fill="#1a73e8"/>
    <text x="1034" y="796" font-size="30" fill="#202124">Isolated &#8212; the rest of the batch finishes</text>
    <text x="1034" y="904" font-size="92" font-weight="bold" fill="#1a73e8">15 of 15</text>
    <text x="1034" y="956" font-size="26" fill="#5f6368">crashed exams still got a teacher card</text>
  </g>
</svg>
